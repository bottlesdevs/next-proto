syntax = "proto3";

package bottles.bottle.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "winebridge.proto";

// Bottle — Wine-prefix lifecycle and configuration.
//
// A thin gRPC facade over next-core's `bottle` module (`BottleManager`,
// `Bottle`, `BottleEdit`). Every long-running mutation there returns an
// `Operation<T>` — simultaneously a progress stream and a future resolving
// to `T` — which each streaming RPC below mirrors as its own
// `<Rpc>Event { oneof { progress; <terminal> } }` message, since `T`
// differs per operation (`BottleState`, `Empty`, `Snapshot`, `string`).
service Bottle {
  // Lifecycle — maps to BottleManager.
  rpc CreateBottle(CreateBottleRequest) returns (stream CreateBottleEvent);
  rpc DeleteBottle(DeleteBottleRequest) returns (stream DeleteBottleEvent);
  rpc GetBottle(BottleRequest) returns (BottleState);
  rpc ListBottles(google.protobuf.Empty) returns (ListBottlesResponse);
  // Mirrors BottleManager::watch: first the current list, then the latest
  // list after each membership (not configuration) change.
  rpc WatchBottles(google.protobuf.Empty) returns (stream ListBottlesResponse);
  // Mirrors Bottle::watch: first the current state, then after each
  // published configuration change.
  rpc WatchBottle(BottleRequest) returns (stream BottleState);

  // Configuration — maps to BottleEdit's batched, order-preserving builder.
  // Unlike the lifecycle RPCs above, commit() is a plain async fn (no
  // progress to report), so this is a unary call.
  rpc EditBottle(EditBottleRequest) returns (BottleState);

  // Components/dependencies (addons) — maps to bottle/software.rs.
  rpc SetComponent(SetComponentRequest) returns (stream SetComponentEvent);
  rpc RemoveComponent(RemoveComponentRequest) returns (stream RemoveComponentEvent);
  rpc InstallDependency(InstallDependencyRequest) returns (stream InstallDependencyEvent);

  // Processes — thin passthrough to the bottle's WineBridge.
  rpc RunProgram(RunProgramRequest) returns (RunProgramResponse);
  rpc ListProcesses(BottleRequest) returns (ListProcessesResponse);
  rpc KillProcess(KillProcessRequest) returns (google.protobuf.Empty);
  // Stops WineBridge, wineserver, and prefix storage.
  rpc StopBottle(BottleRequest) returns (google.protobuf.Empty);

  // DLL overrides.
  rpc ListDllOverrides(BottleRequest) returns (winebridge.ListDllOverridesResponse);
  rpc SetDllOverride(SetDllOverrideRequest) returns (google.protobuf.Empty);
  rpc UnsetDllOverride(UnsetDllOverrideRequest) returns (google.protobuf.Empty);

  // Snapshots (fvs feature) — maps to bottle/snapshot.rs.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (stream CreateSnapshotEvent);
  rpc ListSnapshots(BottleRequest) returns (ListSnapshotsResponse);
  rpc Rollback(RollbackRequest) returns (stream RollbackEvent);
}

// --- Operation<T> progress, shared by every streaming RPC's event message ---

// Mirrors next-core's Stage. An operation is not required to emit every
// stage or follow this declaration order.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_PREPARING = 1;
  STAGE_STOPPING = 2;
  STAGE_DOWNLOADING = 3;
  STAGE_VERIFYING = 4;
  STAGE_EXTRACTING = 5;
  STAGE_CREATING_PREFIX = 6;
  STAGE_CHECKPOINTING = 7;   // fvs feature only
  STAGE_RESTORING = 8;       // fvs feature only
  STAGE_REBUILDING = 9;
  STAGE_CONFIGURING = 10;
  STAGE_REMOVING = 11;
  STAGE_COMMITTING = 12;     // fvs feature only
}

message OperationProgress {
  Stage stage = 1;
  // Set only for STAGE_DOWNLOADING/STAGE_VERIFYING — Stage::Downloading and
  // Stage::Verifying's `file` label.
  optional string file = 2;
  optional Transfer transfer = 3;
}

message Transfer {
  uint64 current = 1;
  optional uint64 total = 2;
}

// --- Core types, mirroring next-core::bottle::state and addons ---

message BottleState {
  string id = 1;
  string name = 2;
  Storage storage = 3;
  repeated Program programs = 4;
  // Keyed by the component's Slot (canonical string, e.g. "runner").
  map<string, Component> components = 5;
  repeated Dependency dependencies = 6;
  map<string, string> environment = 7;
  GamescopeConfig gamescope = 8;
  MangoHudConfig mangohud = 9;
}

enum Storage {
  STORAGE_UNSPECIFIED = 0;
  STORAGE_STANDARD = 1;
  STORAGE_VIRGO = 2; // requires the fvs feature
}

message Program {
  string id = 1;
  string name = 2;
  string executable = 3;
  repeated string args = 4;
  optional string working_directory = 5;
  bool new_console = 6;
}

enum Slot {
  SLOT_UNSPECIFIED = 0;
  SLOT_WINEBRIDGE = 1;
  SLOT_RUNNER = 2;
  SLOT_UMU = 3;
  SLOT_DXVK = 4;
  SLOT_VKD3D = 5;
  SLOT_NVAPI = 6;
  SLOT_LATENCY_FLEX = 7;
}

// Mirrors Requirement — a constraint another addon in the bottle must
// satisfy. Slot requirements can only be satisfied by components.
message Requirement {
  oneof kind {
    string name = 1;
    Slot slot = 2;
    string id = 3;
  }
}

// Mirrors Addon<Component>.
message Component {
  string id = 1;
  string name = 2;
  string version = 3;
  repeated Requirement requirements = 4;
  Slot slot = 5;
}

// Mirrors Addon<Dependency>.
message Dependency {
  string id = 1;
  string name = 2;
  string version = 3;
  repeated Requirement requirements = 4;
}

message GamescopeConfig {
  bool enabled = 1;
  optional uint32 game_width = 2;
  optional uint32 game_height = 3;
  optional uint32 output_width = 4;
  optional uint32 output_height = 5;
  optional uint32 frame_rate = 6;
  optional uint32 unfocused_frame_rate = 7;
  optional Scaler scaler = 8;
  optional Filter filter = 9;
  optional uint32 sharpness = 10;
  bool borderless = 11;
  bool fullscreen = 12;
}

enum Scaler {
  SCALER_UNSPECIFIED = 0;
  SCALER_AUTO = 1;
  SCALER_INTEGER = 2;
  SCALER_FIT = 3;
  SCALER_FILL = 4;
  SCALER_STRETCH = 5;
}

enum Filter {
  FILTER_UNSPECIFIED = 0;
  FILTER_LINEAR = 1;
  FILTER_NEAREST = 2;
  FILTER_FSR = 3;
  FILTER_NIS = 4;
  FILTER_PIXEL = 5;
}

message MangoHudConfig {
  bool enabled = 1;
}

// --- Requests / responses ---

message CreateBottleRequest {
  string name = 1;
  Storage storage = 2;
  string runner_component_id = 3;
}

message CreateBottleEvent {
  oneof event {
    OperationProgress progress = 1;
    BottleState bottle = 2;
  }
}

message BottleRequest {
  string bottle_id = 1;
}

message DeleteBottleRequest {
  string bottle_id = 1;
}

message DeleteBottleEvent {
  oneof event {
    OperationProgress progress = 1;
    google.protobuf.Empty done = 2;
  }
}

message ListBottlesResponse {
  repeated BottleState bottles = 1;
}

// Mirrors BottleEdit's queued Vec<Change> — a flat, per-kind request would
// lose the commit-order-matters semantics BottleEdit::commit documents
// (e.g. a later Rename superseding an earlier one), so this preserves it
// as an ordered list instead.
message EditBottleRequest {
  string bottle_id = 1;
  repeated EditOperation operations = 2;
}

message EditOperation {
  oneof change {
    string rename = 1;
    EnvVar set_env = 2;
    string unset_env = 3;
    Program add_program = 4;
    string remove_program_id = 5;
    GamescopeConfig set_gamescope = 6;
    MangoHudConfig set_mangohud = 7;
  }
}

message EnvVar {
  string key = 1;
  string value = 2;
}

message SetComponentRequest {
  string bottle_id = 1;
  string component_id = 2;
}

message SetComponentEvent {
  oneof event {
    OperationProgress progress = 1;
    google.protobuf.Empty done = 2;
  }
}

message RemoveComponentRequest {
  string bottle_id = 1;
  Slot slot = 2;
}

message RemoveComponentEvent {
  oneof event {
    OperationProgress progress = 1;
    google.protobuf.Empty done = 2;
  }
}

message InstallDependencyRequest {
  string bottle_id = 1;
  string dependency_id = 2;
}

message InstallDependencyEvent {
  oneof event {
    OperationProgress progress = 1;
    google.protobuf.Empty done = 2;
  }
}

message RunProgramRequest {
  string bottle_id = 1;
  string program_id = 2;
}

message RunProgramResponse {
  uint32 pid = 1;
}

message ListProcessesResponse {
  repeated winebridge.Process processes = 1;
}

message KillProcessRequest {
  string bottle_id = 1;
  string program_id = 2;
}

message SetDllOverrideRequest {
  string bottle_id = 1;
  string dll = 2;
  winebridge.DllOverrideMode mode = 3;
}

message UnsetDllOverrideRequest {
  string bottle_id = 1;
  string dll = 2;
}

// --- Snapshots (fvs feature) ---

message CreateSnapshotRequest {
  string bottle_id = 1;
  string message = 2;
}

message CreateSnapshotEvent {
  oneof event {
    OperationProgress progress = 1;
    Snapshot snapshot = 2;
  }
}

message ListSnapshotsResponse {
  repeated SnapshotSummary snapshots = 1;
}

// Mirrors fvs_rs::Commit.
message Snapshot {
  string repository_path = 1;
  string state_id = 2;
  google.protobuf.Timestamp created_at = 3;
  uint64 file_count = 4;
  string message = 5;
  // False when the commit was a no-op (the other fields describe the
  // pre-existing HEAD state, not a newly created one).
  bool created = 6;
}

// Mirrors fvs_rs::CommitSummary — the cheap, list-friendly projection of a
// Snapshot with no nested data.
message SnapshotSummary {
  string repository_path = 1;
  string state_id = 2;
  google.protobuf.Timestamp created_at = 3;
  string message = 4;
  uint64 file_count = 5;
}

message RollbackRequest {
  string bottle_id = 1;
  string state_id_or_prefix = 2;
}

message RollbackEvent {
  oneof event {
    OperationProgress progress = 1;
    string state_id = 2;
  }
}
