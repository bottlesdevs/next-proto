syntax = "proto3";

package bottles.profiles.v1;

import "bottles/common/v1/common.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message UserProfile {
  string id = 1;
  string name = 2;
  string icon = 3;

  repeated bottles.common.v1.LinkedAccount accounts = 4;

  optional SteamLink steam_link = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_activated_at = 7;
}

message SteamLink {
  string steam_id64 = 1;
  string account_name = 2;
}

service Profile {
  rpc ListProfiles(google.protobuf.Empty) returns (ListProfilesResponse);

  rpc GetProfile(GetProfileRequest) returns (UserProfile);

  rpc CreateProfile(CreateProfileRequest) returns (UserProfile);

  rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty);

  rpc RenameProfile(RenameProfileRequest) returns (UserProfile);

  rpc GetActiveProfile(google.protobuf.Empty) returns (GetActiveProfileResponse);

  rpc ActivateProfile(ActivateProfileRequest) returns (ActivateProfileResponse);

  rpc UnlinkAccount(UnlinkAccountRequest) returns (UserProfile);

  rpc LinkSteamAccount(LinkSteamAccountRequest) returns (UserProfile);

  rpc UnlinkSteamAccount(UnlinkSteamAccountRequest) returns (UserProfile);

  rpc WatchActiveProfile(google.protobuf.Empty) returns (stream ProfileEvent);

  rpc WatchSteamSessions(google.protobuf.Empty) returns (stream SteamSessionEvent);
}

message ListProfilesResponse {
  repeated UserProfile profiles = 1;
}

message GetProfileRequest {
  string profile_id = 1;
}

message CreateProfileRequest {
  string name = 1;
  string icon = 2;
}

message DeleteProfileRequest {
  string profile_id = 1;
}

message RenameProfileRequest {
  string profile_id = 1;
  string name = 2;
}

message GetActiveProfileResponse {
  optional UserProfile profile = 1;
}

message ActivateProfileRequest {
  string profile_id = 1;
  repeated bottles.common.v1.Storefront only = 2;
}

message ActivateProfileResponse {
  UserProfile profile = 1;
  repeated AccountActivationResult results = 2;
}

message AccountActivationResult {
  bottles.common.v1.Storefront storefront = 1;
  ActivationOutcome outcome = 2;
  string detail = 3;
}

enum ActivationOutcome {
  ACTIVATION_OUTCOME_UNSPECIFIED = 0;
  ACTIVATION_OUTCOME_SUCCESS = 1;
  ACTIVATION_OUTCOME_NOT_LINKED = 2;
  ACTIVATION_OUTCOME_CREDENTIAL_STALE = 3;
  ACTIVATION_OUTCOME_PLUGIN_UNAVAILABLE = 4;
  ACTIVATION_OUTCOME_NETWORK_ERROR = 5;
}

message UnlinkAccountRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}

message LinkSteamAccountRequest {
  string profile_id = 1;
  string steam_id64 = 2;
  bool auto_activate = 3;
}

message UnlinkSteamAccountRequest {
  string profile_id = 1;
}

message ProfileEvent {
  oneof event {
    UserProfile activated = 1;
    UserProfile updated = 2;
    string deleted_profile_id = 3;
  }
}

message SteamSessionEvent {
  string steam_id64 = 1;
  string account_name = 2;
  bool is_active = 3;
}
