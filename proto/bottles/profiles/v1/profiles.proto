syntax = "proto3";

package bottles.profiles.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "bottles/common/v1/common.proto";

// A profile is a named grouping of storefront sessions.
message Profile {
    string id = 1;
    string name = 2;
    string icon = 3;
    repeated LinkedAccount accounts = 4;
    optional SteamLink steam_link = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp last_activated_at = 7;
}

// A single storefront's session as tracked by a profile.
message LinkedAccount {
    bottles.common.v1.Storefront storefront = 1;
    string account_display_name = 2;
    string account_id = 3;
    AuthState auth_state = 4;
    google.protobuf.Timestamp linked_at = 5;
    google.protobuf.Timestamp last_verified_at = 6;
    optional google.protobuf.Timestamp expires_at = 7;
}

enum AuthState {
    AUTH_STATE_UNSPECIFIED = 0;
    AUTH_STATE_INACTIVE = 1;
    AUTH_STATE_ACTIVE = 2;
    AUTH_STATE_STALE = 3;
}

// Steam is observation-only.
message SteamLink {
    string steam_id64 = 1;
    string account_name = 2;
}

// Profile CRUD, activation, Steam-linked auto-switching
service ProfileService {
    // Lists all profiles for the current user.
    rpc ListProfiles(google.protobuf.Empty) returns (ListProfilesResponse);

    // Retrieves a specific profile by its ID.
    rpc GetProfile(GetProfileRequest) returns (Profile);

    // Creates a new profile for the current user.
    rpc CreateProfile(CreateProfileRequest) returns (Profile);

    // Deletes a profile by its ID.
    rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty);

    // Renames a profile by its ID.
    rpc RenameProfile(RenameProfileRequest) returns (Profile);

    // Retrieves the active profile for the current user.
    rpc GetActiveProfile(google.protobuf.Empty)
        returns (GetActiveProfileResponse);

    // Activates a profile: for every linked account, verifies/refreshes its
    // session via the owning StorePlugin and marks it AUTH_STATE_ACTIVE.
    // Does not perform login from scratch — accounts with AUTH_STATE_STALE
    // are reported back, not silently re-authenticated (that requires the
    // interactive BeginLogin/CompleteLogin flow in StoreService).
    rpc ActivateProfile(ActivateProfileRequest)
        returns (ActivateProfileResponse);

    // Unlinks an account from a profile.
    rpc UnlinkAccount(UnlinkAccountRequest) returns (Profile);

    // Links a Steam account to a profile.
    rpc LinkSteamAccount(LinkSteamAccountRequest) returns (Profile);

    // Unlinks a Steam account from a profile.
    rpc UnlinkSteamAccount(UnlinkSteamAccountRequest) returns (Profile);

    // Server-streaming: UI subscribes instead of polling.
    rpc WatchActiveProfile(google.protobuf.Empty) returns (stream ProfileEvent);

    // Server-streaming: fires when Bottles detects the OS-level Steam
    // active user has changed (via filesystem watch on loginusers.vdf /
    // registry.vdf). Consumers that want auto-switch behavior listen here
    // and call ActivateProfile themselves, or rely on next-core's own
    // internal watcher doing so if auto-activation is enabled on the link.
    rpc WatchSteamSessions(google.protobuf.Empty)
        returns (stream SteamSessionEvent);
}

message ListProfilesResponse {
    repeated Profile profiles = 1;
}

message GetProfileRequest {
    string profile_id = 1;
}

message CreateProfileRequest {
    string name = 1;
    string icon = 2;
}

message DeleteProfileRequest {
    string profile_id = 1;
}

message RenameProfileRequest {
    string profile_id = 1;
    string name = 2;
}

message GetActiveProfileResponse {
    optional Profile profile = 1;
}

message ActivateProfileRequest {
    string profile_id = 1;
    repeated bottles.common.v1.Storefront only = 2;
}

message ActivateProfileResponse {
    Profile profile = 1;
    repeated AccountActivationResult results = 2;
}

message AccountActivationResult {
    bottles.common.v1.Storefront storefront = 1;
    ActivationOutcome outcome = 2;
    string detail = 3;
}

enum ActivationOutcome {
    ACTIVATION_OUTCOME_UNSPECIFIED = 0;
    ACTIVATION_OUTCOME_SUCCESS = 1;
    ACTIVATION_OUTCOME_NOT_LINKED = 2;  // profile has no session for this storefront
    ACTIVATION_OUTCOME_CREDENTIAL_STALE = 3;  // refresh failed, needs CompleteLogin again
    ACTIVATION_OUTCOME_PLUGIN_UNAVAILABLE = 4;  // no StorePlugin registered for this storefront
    ACTIVATION_OUTCOME_NETWORK_ERROR = 5;
}

message UnlinkAccountRequest {
    string profile_id = 1;
    bottles.common.v1.Storefront storefront = 2;
}

message LinkSteamAccountRequest {
    string profile_id = 1;
    string steam_id64 = 2;
    bool auto_activate = 3;
}

message UnlinkSteamAccountRequest {
    string profile_id = 1;
}

message ProfileEvent {
    oneof event {
        Profile activated = 1;
        Profile updated = 2;
        string deleted_profile_id = 3;
    }
}

message SteamSessionEvent {
    string steam_id64 = 1;
    string account_name = 2;
    bool is_active = 3;
}

// StoreService — the storefront-agnostic login/session contract.
//
// This is the wire-level counterpart of the StorePlugin trait in next-core.
// It knows nothing about Epic/GOG/Amazon specifically: every storefront's
// login flow, however different, is expressed through the LoginChallenge
// oneof below. Adding a new storefront never requires changing this file.
service StoreService {
    // Starts an interactive login for a storefront. The returned challenge
    // tells the caller what to present to the user (a URL to open, a device
    // code to display, etc). Does not block on user action.
    rpc BeginLogin(BeginLoginRequest) returns (LoginChallenge);

    // Completes a previously started login. For flows that need user input
    // (an authorization code, an exchange token) it's passed here; for
    // flows that resolve via polling or redirect capture, user_input is
    // left empty and the server resolves it out-of-band.
    rpc CompleteLogin(CompleteLoginRequest) returns (LinkedAccount);

    // Cheap, non-interactive: asks the owning plugin to verify/refresh the
    // stored session for this storefront on this profile.
    rpc RefreshSession(RefreshSessionRequest) returns (LinkedAccount);

    // Revokes the stored session for this storefront on this profile.
    rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty);

    // Lists storefronts with a registered, working StorePlugin.
    rpc ListAvailableStorefronts(google.protobuf.Empty)
        returns (ListAvailableStorefrontsResponse);
}

message BeginLoginRequest {
    string profile_id = 1;
    bottles.common.v1.Storefront storefront = 2;
}

message LoginChallenge {
    string challenge_id = 1;
    // Set only when BeginLogin itself already failed synchronously.
    optional string error = 2;

    oneof kind {
        BrowserRedirectChallenge browser_redirect = 3;
        DeviceCodeChallenge device_code = 4;
        OAuthRedirectChallenge oauth_redirect = 5;
    }
}

// Epic-style: open a URL in a browser, user completes login there and is
// handed a code they paste back (or it's captured via local redirect).
message BrowserRedirectChallenge {
    string url = 1;
    LoginInputKind expects = 2;
}

// Amazon-style: show a short code, user enters it on
// verification_url from any device. Caller should poll CompleteLogin
// with an empty user_input until it resolves or expires_in elapses.
message DeviceCodeChallenge {
    string verification_url = 1;
    string user_code = 2;
    uint32 expires_in_seconds = 3;
    uint32 poll_interval_seconds = 4;
}

// GOG-style: standard OAuth2 authorization-code redirect against a
// local loopback listener next-core stands up for the duration of the
// challenge.
message OAuthRedirectChallenge {
    string auth_url = 1;
    string redirect_uri = 2;
}

enum LoginInputKind {
    LOGIN_INPUT_KIND_UNSPECIFIED = 0;
    LOGIN_INPUT_KIND_AUTHORIZATION_CODE = 1;
    LOGIN_INPUT_KIND_EXCHANGE_TOKEN = 2;
    LOGIN_INPUT_KIND_NONE = 3;
}

message CompleteLoginRequest {
    string challenge_id = 1;
    string profile_id = 2;
    bottles.common.v1.Storefront storefront = 3;
    string user_input = 4;
}

message RefreshSessionRequest {
    string profile_id = 1;
    bottles.common.v1.Storefront storefront = 2;
}

message RevokeSessionRequest {
    string profile_id = 1;
    bottles.common.v1.Storefront storefront = 2;
}

message ListAvailableStorefrontsResponse {
    repeated bottles.common.v1.Storefront storefronts = 1;
}
