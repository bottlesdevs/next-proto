syntax = "proto3";

package bottles.profiles.v1;

import "bottles/common/v1/common.proto";
import "bottles/steam/v1/steam.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// A local profile: an identity a person switches into to see their own
// linked storefront/Steam accounts and library. Doesn't itself hold
// credentials for those accounts — see bottles.accounts.v1.Accounts.
message UserProfile {
  string id = 1;
  string name = 2;
  string icon = 3;

  repeated bottles.common.v1.LinkedAccount accounts = 4;

  optional bottles.steam.v1.SteamLink steam_link = 5;

  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_activated_at = 7;
}

service Profile {
  rpc ListProfiles(google.protobuf.Empty) returns (ListProfilesResponse);

  rpc GetProfile(GetProfileRequest) returns (UserProfile);

  rpc CreateProfile(CreateProfileRequest) returns (UserProfile);

  rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty);

  rpc RenameProfile(RenameProfileRequest) returns (UserProfile);

  rpc UpdateProfile(UserProfile) returns (google.protobuf.Empty);

  rpc GetActiveProfile(google.protobuf.Empty) returns (GetActiveProfileResponse);

  // Marks a profile as the active one. Doesn't touch storefront
  // credentials — see bottles.accounts.v1.Accounts.ActivateAccounts for
  // refreshing those.
  rpc ActivateProfile(ActivateProfileRequest) returns (UserProfile);

  // Server-streaming: subscribes to activation/update/delete events instead
  // of polling.
  rpc WatchActiveProfile(google.protobuf.Empty) returns (stream ProfileEvent);
}

message ListProfilesResponse {
  repeated UserProfile profiles = 1;
}

message GetProfileRequest {
  string profile_id = 1;
}

message CreateProfileRequest {
  string name = 1;
  string icon = 2;
}

message DeleteProfileRequest {
  string profile_id = 1;
}

message RenameProfileRequest {
  string profile_id = 1;
  string name = 2;
}

message GetActiveProfileResponse {
  // Unset if no profile has ever been activated (e.g. first run).
  optional UserProfile profile = 1;
}

message ActivateProfileRequest {
  string profile_id = 1;
}

message ProfileEvent {
  oneof event {
    UserProfile activated = 1;
    UserProfile updated = 2;
    // The id of a profile that was just deleted.
    string deleted_profile_id = 3;
  }
}
