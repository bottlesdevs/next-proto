syntax = "proto3";

package bottles.accounts.v1;

import "bottles/common/v1/common.proto";
import "google/protobuf/empty.proto";

service Accounts {
  // Completes an interactive login (started via Plugin.BeginLogin) and
  // attaches the resulting LinkedAccount to the profile, replacing any
  // existing link for the same storefront.
  rpc LinkProfile(LinkProfileRequest) returns (bottles.common.v1.LinkedAccount);

  rpc RefreshAccount(RefreshAccountRequest) returns (bottles.common.v1.LinkedAccount);

  rpc UnlinkProfile(UnlinkProfileRequest) returns (google.protobuf.Empty);
}

message LinkProfileRequest {
  string profile_id = 1;
  string challenge_id = 2;
  bottles.common.v1.Storefront storefront = 3;
  string user_input = 4;
}

message RefreshAccountRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}

message UnlinkProfileRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}
