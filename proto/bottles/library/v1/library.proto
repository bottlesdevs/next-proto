syntax = "proto3";

package bottles.library.v1;

import "bottles/common/v1/common.proto";
import "google/protobuf/empty.proto";

// Library — a profile's owned/installed games, aggregated across every
// storefront it has linked accounts for.
service Library {
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);

  // Server-streaming: fans out Plugin.WatchGames across every storefront
  // the profile has linked and merges the results, so callers subscribe
  // once instead of per-storefront.
  rpc WatchGames(WatchGamesRequest) returns (stream GameEvent);

  // Downloads a game via the owning storefront plugin's
  // Store.GetInstallManifest and writes it directly into the given
  // Bottle's prefix (bottles.bottle.v1), reporting progress as it goes.
  rpc InstallGame(InstallGameRequest) returns (stream InstallGameEvent);

  // Cancels an install in progress. A no-op, not an error, if nothing is
  // installing for this game.
  rpc CancelInstall(InstallGameRequest) returns (google.protobuf.Empty);

  // Removes a previously installed game's files and clears its install
  // record. A no-op, not an error, if it isn't installed.
  rpc UninstallGame(InstallGameRequest) returns (google.protobuf.Empty);
}

message ListGamesRequest {
  string profile_id = 1;
}

message ListGamesResponse {
  repeated bottles.common.v1.Game games = 1;
}

message WatchGamesRequest {
  string profile_id = 1;
}

message GameEvent {
  oneof event {
    GameAdded added = 1;
    GameUpdated updated = 2;
    GameRemoved removed = 3;
  }
}

message GameAdded {
  bottles.common.v1.Game game = 1;
}

message GameUpdated {
  bottles.common.v1.Game game = 1;
}

message GameRemoved {
  // No longer owned/visible on the storefront (e.g. removed from the
  // account's library) — distinct from UninstallGame, which only removes
  // local install state and leaves ownership untouched.
  bottles.common.v1.Storefront storefront = 1;
  string game_id = 2;
}

message InstallGameRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
  string game_id = 3;
  // Which Bottle to install into. Required for InstallGame; ignored by
  // CancelInstall (an in-flight install is already tied to one) and by
  // UninstallGame once the InstallRecord already names it — both reuse
  // this message for its (profile_id, storefront, game_id) identity.
  string bottle_id = 4;
}

message InstallGameEvent {
  oneof event {
    InstallProgress progress = 1;
    bottles.common.v1.InstallState done = 2;
  }
}

message InstallProgress {
  string current_file = 1;
  uint64 bytes_downloaded = 2;
  optional uint64 total_bytes = 3;
  double bytes_per_second = 4;
}
