syntax = "proto3";

package bottles.store.v1;

import "bottles/common/v1/common.proto";
import "bottles/library/v1/library.proto";
import "bottles/profiles/v1/profiles.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// StoreService — the storefront-agnostic login/session contract.
//
// This is the wire-level counterpart of the StorePlugin trait in next-core.
// It knows nothing about Epic/GOG/Amazon specifically: every storefront's
// login flow, however different, is expressed through the LoginChallenge
// oneof below. Adding a new storefront never requires changing this file.
service Store {
  // Starts an interactive login for a storefront. The returned challenge
  // tells the caller what to present to the user (a URL to open, a device
  // code to display, etc). Does not block on user action.
  rpc BeginLogin(BeginLoginRequest) returns (LoginChallenge);

  // Completes a previously started login. For flows that need user input
  // (an authorization code, an exchange token) it's passed here; for
  // flows that resolve via polling or redirect capture, user_input is
  // left empty and the server resolves it out-of-band.
  rpc CompleteLogin(CompleteLoginRequest) returns (bottles.common.v1.LinkedAccount);

  // Cheap, non-interactive: asks the owning plugin to verify/refresh the
  // stored session for this storefront on this profile.
  rpc RefreshSession(RefreshSessionRequest) returns (bottles.common.v1.LinkedAccount);

  // Revokes the stored session for this storefront on this profile.
  rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty);

  // Returns this plugin's game library for the given profile. The
  // wire-level counterpart of StorePlugin::games().
  rpc ListGames(ListGamesRequest) returns (ListGamesResponse);

  // Streams library changes for this plugin's single storefront as they're
  // detected (polling-based where the storefront has no push API of its
  // own). Library.WatchGames fans this out across every requested
  // storefront and merges the results.
  rpc WatchGames(WatchGamesRequest) returns (stream bottles.library.v1.GameEvent);

  // Resolves what Library.InstallGame needs to actually fetch this game:
  // a flat list of files, each as one or more content-addressed chunks
  // with their own download URLs. Called once per user-initiated
  // install, not per listing, so plugins are free to hit whatever
  // storefront endpoint they need without the request-volume concerns
  // ListGames has.
  //
  // Modeled on how GOG (Galaxy builds/depot v2) and Epic (chunked CDN
  // manifests) actually distribute games — neither ever runs an
  // installer; both are "download content-defined chunks, write them at
  // their file's byte offset". Library only needs "where do the
  // bytes come from and how do they reassemble" — this flattens that
  // difference the same way LoginChallenge flattens login flows. Chunk
  // URLs may be short-lived; a plugin that can't guarantee a URL
  // survives a paused-and-resumed download should have InstallGame call
  // GetInstallManifest again before resuming rather than caching it
  // long-term. Storefronts without this capability yet return
  // UNIMPLEMENTED.
  rpc GetInstallManifest(GetInstallManifestRequest) returns (InstallManifest);
}

message GetInstallManifestRequest {
  string profile_id = 1;
  string game_id = 2;
}

message InstallManifest {
  string version = 1;
  optional uint64 install_size_bytes = 2;
  repeated InstallFile files = 3;

  // Folder name every file's relative_path is installed under, e.g.
  // "Hollow Knight" — the same canonical directory name the
  // storefront's own official client would use (GOG: the build
  // manifest's own installDirectory field), not derived from the
  // game's display title, since that's not guaranteed to be
  // filesystem-safe or match what other tooling / save-game paths
  // expect. Installed at "C:\Program Files\<install_directory>".
  string install_directory = 6;

  // Relative path (within the installed files) of the file to launch.
  // Set directly by storefronts whose manifest carries it outright
  // (Epic's launch_exe); left unset by storefronts that don't know it
  // until after download (GOG ships it inside a downloaded
  // goggame-<id>.info file's playTasks, not the manifest itself) — for
  // those, InstallGame falls back to a best-effort post-download scan.
  optional string primary_executable = 4;

  // Present only for storefronts whose manifest can bundle an optional
  // post-install redistributable installer (Epic's prereq_path/args;
  // GOG never sets this — its redistributables are downloaded but never
  // auto-run, matching gogdl/Heroic's own behavior). Unset means there's
  // nothing to run after the file download completes.
  optional Prerequisite prerequisite = 5;
}

message InstallFile {
  // Destination path relative to the install directory, e.g.
  // "redist/directx/dxsetup.exe".
  string relative_path = 1;
  // Total reconstructed file size, when known.
  optional uint64 size_bytes = 2;
  // Ordered; concatenating each chunk's decompressed bytes in order
  // reconstructs the file exactly (no chunk reuse/sub-ranging modeled —
  // neither GOG's nor Epic's common case needs it).
  repeated Chunk chunks = 3;
}

message Chunk {
  string download_url = 1;
  // Whether the downloaded bytes are zlib-compressed and need
  // decompressing before being written to the destination file.
  bool compressed = 2;
  // Decompressed size, for progress reporting and buffer sizing.
  optional uint64 size_bytes = 3;
  optional string md5 = 4;
}

// An optional post-install step for storefronts that need one (Epic's
// bundled DirectX/VC++ redistributable installer, run once after every
// InstallFile has been written). Not part of the core "download and
// place files" path — parse-but-ignore is a valid choice for a caller
// that doesn't want to execute anything during install.
message Prerequisite {
  // Relative path (within the already-downloaded files) of the
  // executable to run.
  string relative_path = 1;
  repeated string arguments = 2;
}

message BeginLoginRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}

message LoginChallenge {
  string challenge_id = 1;
  // Set only when BeginLogin itself already failed synchronously.
  optional string error = 2;

  oneof kind {
    BrowserRedirectChallenge browser_redirect = 3;
    DeviceCodeChallenge device_code = 4;
    OAuthRedirectChallenge oauth_redirect = 5;
  }
}

// Epic-style: open a URL in a browser, user completes login there and is
// handed a code they paste back (or it's captured via local redirect).
message BrowserRedirectChallenge {
  string url = 1;
  LoginInputKind expects = 2;
}

// Amazon-style: show a short code, user enters it on
// verification_url from any device. Caller should poll CompleteLogin
// with an empty user_input until it resolves or expires_in elapses.
message DeviceCodeChallenge {
  string verification_url = 1;
  string user_code = 2;
  uint32 expires_in_seconds = 3;
  uint32 poll_interval_seconds = 4;
}

// GOG-style: standard OAuth2 authorization-code redirect against a
// local loopback listener next-core stands up for the duration of the
// challenge.
message OAuthRedirectChallenge {
  string auth_url = 1;
  string redirect_uri = 2;
}

enum LoginInputKind {
  LOGIN_INPUT_KIND_UNSPECIFIED = 0;
  LOGIN_INPUT_KIND_AUTHORIZATION_CODE = 1;
  LOGIN_INPUT_KIND_EXCHANGE_TOKEN = 2;
  LOGIN_INPUT_KIND_NONE = 3;
}

message CompleteLoginRequest {
  string challenge_id = 1;
  string profile_id = 2;
  bottles.common.v1.Storefront storefront = 3;
  string user_input = 4;
}

message RefreshSessionRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}

message RevokeSessionRequest {
  string profile_id = 1;
  bottles.common.v1.Storefront storefront = 2;
}

message ListGamesRequest {
  string profile_id = 1;
}

message ListGamesResponse {
  repeated bottles.common.v1.Game games = 1;
}

message WatchGamesRequest {
  string profile_id = 1;
}
